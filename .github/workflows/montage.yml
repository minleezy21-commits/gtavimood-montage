name: montage
on:
  schedule:
    - cron: '0 7,11,15 * * *'
  workflow_dispatch:
    inputs:
      drive_id:
        required: false
      name:
        required: false
      format:
        default: vertical
      caption:
        default: GTA VI MOOD
      min_seconds:
        default: '0'
      outro:
        default: '@gtavimood'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Montage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_ID: ${{ inputs.drive_id }}
          IN_NAME: ${{ inputs.name }}
          IN_FMT: ${{ inputs.format }}
          IN_CAP: ${{ inputs.caption }}
          IN_MIN: ${{ inputs.min_seconds }}
          IN_OUTRO: ${{ inputs.outro }}
        run: |
          if [ -n "$IN_ID" ]; then
            bash make.sh "$IN_ID" "$IN_NAME" "$IN_FMT" "$IN_CAP" "$IN_MIN" "$IN_OUTRO"
            exit 0
          fi
          n=0
          while IFS='|' read -r id name fmt cap min; do
            [ -z "$id" ] && continue
            if gh release view "$name" >/dev/null 2>&1; then continue; fi
            bash make.sh "$id" "$name" "$fmt" "$cap" "$min" "@gtavimood" || echo "echec $name"
            n=$((n+1)); [ "$n" -ge 3 ] && break
          done < queue.txt
